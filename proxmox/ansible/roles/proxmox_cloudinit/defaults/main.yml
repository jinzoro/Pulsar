cloud_init_defaults:
  ciuser: "admin"
  cipassword: ""
  ipconfig: "ip=dhcp"
  nameserver: "1.1.1.1 8.8.8.8"
  searchdomain: "example.com"
  sshkeys: []
  cicustom: ""
