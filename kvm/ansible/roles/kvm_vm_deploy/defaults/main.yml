# KVM VM Deploy Role - defaults/main.yml

kvm_vms:
  - name: "web-server"
    vcpus: 2
    memory: 4096
    disk_size: "32G"
    disk_bus: "virtio"
    storage_pool: "default"
    network: "default"
    network_model: "virtio"
    iso: ""
    cloud_init: ""
    os_type: "linux"
    arch: "x86_64"
    machine_type: "q35"
    cpu_model: "host"
    boot: "cdrom,hd"
    autostart: true
    state: "present"

  - name: "db-server"
    vcpus: 4
    memory: 8192
    disk_size: "64G"
    disk_bus: "virtio"
    storage_pool: "default"
    network: "default"
    network_model: "virtio"
    iso: ""
    cloud_init: ""
    os_type: "linux"
    arch: "x86_64"
    machine_type: "q35"
    cpu_model: "host"
    boot: "cdrom,hd"
    autostart: true
    state: "present"

