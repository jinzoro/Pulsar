---
# SPDX-License-Identifier: MIT
# Setup Software Defined Networking

- name: Configure Proxmox SDN
  hosts: pve_nodes[0]
  become: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: proxmox_sdn
      tags: [sdn_setup]

- name: Verify SDN configuration
  hosts: pve_nodes
  become: true
  tasks:
    - name: Check SDN zones
      ansible.builtin.uri:
        url: "https://{{ proxmox_node }}:8006/api2/json/sdn/zones"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_user }}!={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_verify_ssl }}"
        status_code: [200]
      register: sdn_zones_check

    - name: Check SDN vnets
      ansible.builtin.uri:
        url: "https://{{ proxmox_node }}:8006/api2/json/sdn/vnets"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_user }}!={{ proxmox_token_id }}={{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_verify_ssl }}"
        status_code: [200]
      register: sdn_vnets_check

    - name: Display SDN status
      ansible.builtin.debug:
        msg: >-
          SDN Zones: {{ sdn_zones_check.json.data | default([]) | length }},
          VNets: {{ sdn_vnets_check.json.data | default([]) | length }}
