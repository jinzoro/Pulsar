# Proxmox SDN Role - handlers/main.yml

- name: apply sdn config
  ansible.builtin.uri:
    url: "https://{{ proxmox_node }}:8006/api2/json/sdn"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ proxmox_user }}!={{ proxmox_token_id }}={{ proxmox_token_secret }}"
      Content-Type: "application/json"
    body_format: json
    body: {}
    validate_certs: "{{ proxmox_verify_ssl }}"
    status_code: [200]
