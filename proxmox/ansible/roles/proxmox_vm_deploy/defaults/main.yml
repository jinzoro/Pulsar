# Proxmox VM Deploy Role - defaults/main.yml

proxmox_vms:
  - name: web-server
    vmid: 100
    node: "{{ proxmox_node }}"
    cores: 2
    memory: 4096
    disk_size: "32G"
    disk_storage: "{{ proxmox_default_storage }}"
    disk_bus: "virtio-scsi-single"
    net_model: "virtio"
    net_bridge: "vmbr0"
    iso: ""
    template: ""
    cpu_type: "host"
    bios: "seabios"
    machine: "q35"
    os_type: "l26"
    scsihw: "virtio-scsi-single"
    agent: true
    state: present
    description: "Web Server"
    tags: "web,prod"

  - name: database-server
    vmid: 101
    node: "{{ proxmox_node }}"
    cores: 4
    memory: 8192
    disk_size: "64G"
    disk_storage: "{{ proxmox_default_storage }}"
    disk_bus: "virtio-scsi-single"
    net_model: "virtio"
    net_bridge: "vmbr0"
    iso: ""
    template: ""
    cpu_type: "host"
    bios: "seabios"
    machine: "q35"
    os_type: "l26"
    scsihw: "virtio-scsi-single"
    agent: true
    state: present
    description: "Database Server"
    tags: "db,prod"

