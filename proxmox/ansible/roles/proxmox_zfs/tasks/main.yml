# Proxmox ZFS Role - tasks/main.yml

- name: Ensure ZFS tools are installed
  ansible.builtin.apt:
    name:
      - zfsutils-linux
      - zfs-dkms
    state: present
  tags: proxmox_zfs

- name: Check existing ZFS pools
  ansible.builtin.command: zpool list -H -o name
  register: existing_zpools
  changed_when: false
  tags: proxmox_zfs

- name: Create ZFS pools
  community.general.zpool:
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    devices: "{{ item.devices }}"
    state: present
    ashift: "{{ item.ashift | default(12) }}"
    extra_zpool_properties:
      autoexpand: "{{ item.autoexpand | default(true) }}"
      autotrim: "{{ item.autotrim | default('on') }}"
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "Pool: {{ item.name }}"
  when:
    - item.name not in existing_zpools.stdout_lines
    - item.state | default('present') != 'absent'
  tags: proxmox_zfs

- name: Create ZFS datasets
  community.general.zpool_facts:
    name: "{{ item.pool }}"
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "Check pool: {{ item.pool }}"
  register: pool_facts
  tags: proxmox_zfs

- name: Create ZFS filesystem datasets
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties:
      mountpoint: "{{ item.mountpoint | default('/' + item.name) }}"
      compression: "{{ item.compression | default('lz4') }}"
      atime: "{{ item.atime | default('off') }}"
      xattr: "{{ item.xattr | default(omit) }}"
      dnodesize: "{{ item.dnodesize | default(omit) }}"
      recordsize: "{{ item.recordsize | default(omit) }}"
      logbias: "{{ item.logbias | default(omit) }}"
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "Dataset: {{ item.name }}"
  when: item.type | default('filesystem') == 'filesystem'
  tags: proxmox_zfs

- name: Create ZFS volume datasets
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties:
      compression: "{{ item.compression | default('off') }}"
      recordsize: "{{ item.recordsize | default(omit) }}"
      volsize: "{{ item.volsize | default('10G') }}"
  loop: "{{ zfs_datasets }}"
  loop_control:
    label: "Volume: {{ item.name }}"
  when: item.type | default('filesystem') == 'volume'
  tags: proxmox_zfs

- name: Set additional ZFS properties
  ansible.builtin.command: >-
    zfs set {{ item.property }}={{ item.value }} {{ item.pool }}
  loop: "{{ zfs_properties }}"
  loop_control:
    label: "{{ item.pool }}: {{ item.property }}={{ item.value }}"
  changed_when: true
  when: zfs_properties | default([]) | length > 0
  tags: proxmox_zfs

- name: Configure automatic scrub
  ansible.builtin.cron:
    name: "ZFS scrub {{ item.name }}"
    minute: "0"
    hour: "{{ zfs_scrub_hour | default('3') }}"
    day: "*"
    month: "*"
    weekday: "{{ zfs_scrub_day | default('Sunday') }}"
    job: "zpool scrub {{ item.name }}"
    user: root
  loop: "{{ zfs_pools }}"
  loop_control:
    label: "Scrub: {{ item.name }}"
  when: zfs_auto_scrub | default(true)
  tags: proxmox_zfs

- name: Verify ZFS pool status
  ansible.builtin.command: zpool status
  register: zpool_status
  changed_when: false
  tags: proxmox_zfs

- name: Display ZFS configuration
  ansible.builtin.debug:
    msg: "{{ zpool_status.stdout_lines }}"
  tags: proxmox_zfs
