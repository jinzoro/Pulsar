# Proxmox Hardening Role - handlers/main.yml

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.systemd:
    name: auditd
    state: restarted

- name: restart pveproxy
  ansible.builtin.systemd:
    name: pveproxy
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
